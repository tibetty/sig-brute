plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'me.tibetty'
version = findProperty('version') ?: '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.yaml:snakeyaml:2.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'me.tibetty.sigbrute.Main'
    }
}

shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
}

tasks.named('javadoc') {
    modularity.inferModulePath = false
    excludes = ['module-info.java', 'me/tibetty/sigbrute/decode/infer/**',
        'me/tibetty/sigbrute/Main.java', 'me/tibetty/sigbrute/decode/DecodeMain.java']
    options {
        tags = ['apiNote:a:API Note:']
        addStringOption('Xdoclint:none', '-quiet')
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'sig-brute'
                description = 'Ethereum ABI selector brute-force and calldata decode library'
                url = 'https://github.com/tibetty/sig-brute'
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                developers {
                    developer {
                        id = 'tibetty'
                        name = 'tibetty'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/tibetty/sig-brute.git'
                    developerConnection = 'scm:git:ssh://github.com/tibetty/sig-brute.git'
                    url = 'https://github.com/tibetty/sig-brute'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
        maven {
            name = 'MavenCentral'
            def isSnapshot = version.toString().endsWith('SNAPSHOT')
            url = isSnapshot
                ? 'https://central.sonatype.com/repository/maven-snapshots/'
                : 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = findProperty('mavenCentralUsername') ?: ''
                password = findProperty('mavenCentralPassword') ?: ''
            }
        }
    }
}

def signingKey = findProperty('signingInMemoryKey')
def signingPassword = findProperty('signingInMemoryKeyPassword')
if (signingKey && signingPassword) {
    signing {
        useInMemoryPgpKeys(signingKey.toString(), signingPassword.toString())
        sign publishing.publications.maven
    }
}
