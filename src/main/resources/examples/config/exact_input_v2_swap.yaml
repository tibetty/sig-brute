#   exactInputV2Swap((address,address,uint256,uint256,uint256,uint256,address[],address[],bytes,string),uint256)
# Selector: 0x0dc4bdae

selector: "0x0dc4bdae"
method_names: [exactInputV2Swap]

args:
  - ():
      - [address]
      - [address]
      - [bytes32, uint256]
      - [uint256]
      - [uint256]
      - [uint256]
      - "[]":
          - [address]
      - "[]":
          - [address]
      - [bytes]
      - [bytes, string]

  - [uint256]

find_first: true
