# Publishes signed artifacts to Maven Central when a version tag is pushed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MAVEN_CENTRAL_USERNAME  — Central Portal user token username
#   MAVEN_CENTRAL_PASSWORD  — Central Portal user token password
#   SIGNING_KEY             — armored GPG private key (ASCII)
#   SIGNING_PASSWORD        — passphrase for SIGNING_KEY
#
# Create a release: git tag v1.0.0 && git push origin v1.0.0
# Artifacts appear at https://central.sonatype.com/publishing after the workflow runs;
# with AUTOMATIC publishing enabled on the namespace, release is hands-off.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 1.0.0)
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version || '1.0.0' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test publishToSonatype closeAndReleaseSonatypeStagingRepository \
            --no-daemon -Pversion="${{ steps.version.outputs.value }}"
